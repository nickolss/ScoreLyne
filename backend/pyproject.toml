[project]
name = "scorelyne-backend"
version = "0.1.0"
description = "Backend do ScoreLyne: operadora mock, motor de score e ferramentas do agente"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "psycopg[binary]>=3.2",
    "scikit-learn>=1.9.1",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
operadora = "scorelyne.operadora.cli:main"
score = "scorelyne.score.cli:main"
banco = "scorelyne.banco.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scorelyne"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
